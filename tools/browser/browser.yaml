# PropStream selector calibration — REAL selectors observed on the live site
# via `tools.browser.cli --check` DOM inventory (2026-07-24, login page).
# Selectors are data, not secrets: committed so `git pull` calibrates the VPS.
# App-side selectors get appended after the first authenticated inventory.

selectors:
  login.username:
    by: css
    css: 'input[name="username"]'
  login.password:
    by: css
    css: 'input[name="password"]'
  login.submit:
    by: css
    css: 'button[type="submit"].gradient-btn'
  # OneTrust cookie banner: accept button when the banner is up (harmless if
  # absent — the flow clicks consent only when present).
  consent.accept:
    by: css
    css: '#onetrust-accept-btn-handler'
  # Login failure surfaces as an alert/error text near the form.
  login.error:
    by: css
    css: '.error, .alert, [class*="error"]'

  # --- authenticated app (observed live 2026-07-24, app.propstream.com) ---
  # The search input is the most stable authenticated-state anchor (element
  # ids are session-generated; CSS-module class names are build-hashed).
  app.ready:
    by: placeholder
    text: 'Enter County, City, Zip Code(s) or APN #'
  search.box:
    by: placeholder
    text: 'Enter County, City, Zip Code(s) or APN #'
  # The header's explicit Search button (screenshot-confirmed) EXECUTES the
  # typed geography — typing alone never runs the search. Note: 'Search' text
  # also exists as the sidebar nav item, so flows click via click_text (last
  # match in document order = the header button), not this spec directly.
  search.submit:
    by: text
    text: 'Search'
  # top bar reads "Filters | Save | Clear All" — the Filters control opens
  # the filter panel (page text confirms; not a <button>, so anchor by text)
  filters.open:
    by: text
    text: 'Filters'
  # --- inside the Filters panel (observed live 2026-07-24, stage-3 DOM) ---
  # The panel's own filter-name search: the robust way to reach any filter
  # section (the Min/Max input ids are random UUIDs — never target those).
  # NOTE: the app REMOVES this input's placeholder attribute once it has a
  # value (observed live), so anchor by the stable class-path fragment.
  filters.find:
    by: css
    css: 'input[class*="earchFilterNew"]'
  # "View Properties" executes the filtered search — this is our apply.
  filters.apply:
    by: role
    role: button
    name: 'View Properties'
  # Property Classification chips. NOTE 'Vacant Land' also appears as a Lead
  # List row ("Vacant Land 0"), so the chip must be scoped under the
  # "Property Classification(s)" heading — the flow does this positionally,
  # not by these selectors alone (kept for reference/manual calibration).
  filters.property_class: {by: text, text: 'Property Classification(s)'}
  # Confirmed panel labels (Value & Equity section) for the recipe ranges:
  #   Lot Size (SqFt) · Years of Ownership · Assessed Improvement Value ·
  #   Improvement to Tax Value % · Estimated Value · Assessed Land Value
  # These are label-anchored Min/Max pairs (fill_labeled_range), never by id.
